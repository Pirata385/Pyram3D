[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyram3d"
version = "0.1.0"
description = "AI-first 3D modeling toolkit: model in Python, export glTF/GLB/FBX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
images = ["pillow"]
dev = ["pytest"]

[project.scripts]
pyram3d = "pyram3d.__main__:main"

[tool.setuptools.packages.find]
include = ["pyram3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
